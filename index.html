<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#37573c"><title>Nông Trại Mây</title><link rel="stylesheet" href="style.css?v=cloud-2b"></head><body>
<main class="game-wrap" aria-label="Nông Trại Mây">
<canvas id="game" aria-label="Bản đồ trang trại. Chạm để đi hoặc tương tác. Kéo để xem xung quanh."></canvas>
<header class="hud-top"><div class="hud-main"><a class="brand" href="#"><span class="cloud-mark">☁</span><span>NÔNG TRẠI MÂY<small id="farmDay">MÙA XUÂN · NGÀY 01</small></span></a><div class="wallet"><span id="coins" aria-label="Số xu"></span><span id="tickets" aria-label="Vé tuyển dụng"></span></div><div class="utility"><button id="sound" aria-label="Bật tắt âm thanh">♪</button><button id="fullscreen" aria-label="Toàn màn hình">⛶</button><button id="help" aria-label="Menu và hướng dẫn">☰</button></div></div><div class="identity-row"><div class="portrait"><i class="farmer-icon"></i></div><div class="identity-name"><b>Vườn Mây Nhỏ</b><span id="level"></span></div><div class="progress"><i id="xpbar"></i></div><div class="garden-stats"><span><i>🌱</i><b id="readyCount">0</b><small>chín</small></span><span><i>👒</i><b id="workingCount">0</b><small>đang làm</small></span></div></div><button class="weather" id="weatherButton"><span class="season-label">NHỊP MÙA</span><span><b id="weatherName"></b><small id="weatherNext"></small></span><span id="seasonAdvice"></span><span class="chevron">›</span></button></header>
<section class="hud-left"><span class="map-place">⌂ KHU VƯỜN NHÀ <i>• mùa xuân</i></span></section><button class="quest-preview" data-panel="quests"><span class="quest-icon">✦</span><span><strong id="questTitle"></strong><small id="questDesc"></small></span><span class="chevron">›</span></button><button class="weather-card" id="weatherCard" aria-label="Chi tiết thời tiết"><span id="weatherSummary"></span><span id="weatherCrops"></span></button>
<div class="map-actions" aria-label="Điều khiển bản đồ"><button id="zoomin" aria-label="Phóng to bản đồ">+</button><button id="zoomout" aria-label="Thu nhỏ bản đồ">−</button><button id="centerCamera" aria-label="Theo dõi nhân vật" title="Theo dõi nhân vật">⌖</button><button id="overview" aria-label="Xem toàn bộ trang trại" title="Toàn bộ trang trại">▧</button></div>
<div class="map-tip" id="mapHint">Chạm để đi · Kéo để khám phá</div>
<div class="movement-status" id="movementStatus" role="status">Sẵn sàng làm vườn</div><section class="toolbar" aria-label="Công cụ làm vườn"><div class="tool-status"><div class="movement-tools"><button id="queueMode" aria-pressed="false" aria-label="Bật chế độ làm việc liên tiếp">⇢ Liên tiếp</button><button id="stopMove" aria-label="Dừng di chuyển và hủy việc đang chờ">■</button></div><span><small>CÔNG CỤ</small><strong id="selected">🥕 Hạt cà rốt</strong></span><button id="sell">Bán nông sản ↗</button></div><div class="tools"><button data-tool="carrot" class="active" aria-pressed="true" aria-label="Chọn hạt cà rốt"><span>🥕</span><small>Cà rốt</small></button><button data-tool="wheat" aria-pressed="false" aria-label="Chọn hạt lúa mì"><span>🌾</span><small>Lúa mì</small></button><button data-tool="berry" aria-pressed="false" aria-label="Chọn hạt dâu tây"><span>🍓</span><small>Dâu tây</small></button><button data-tool="water" aria-pressed="false" aria-label="Chọn bình tưới"><span>🚿</span><small>Tưới nước</small></button><button data-tool="protect" aria-pressed="false" aria-label="Che luống, 8 xu"><span>🛡</span><small>Che luống</small></button><button data-tool="harvest" aria-pressed="false" aria-label="Chọn thu hoạch"><span>🧺</span><small>Thu hoạch</small></button></div></section>
<nav aria-label="Menu trang trại"><button data-panel="farm" class="active" aria-label="Trang trại"><i>🌿</i><span>Vườn tôi</span></button><button data-panel="quests" aria-label="Nhiệm vụ"><i>📜</i><span>Nhiệm vụ</span><b id="qbadge">!</b></button><button data-panel="staff" aria-label="Nhân viên"><i>👥</i><span>Nhân viên</span></button><button data-panel="gacha" aria-label="Tuyển dụng"><i>✨</i><span>Chiêu mộ</span></button><button data-panel="bag" aria-label="Túi đồ và cửa hàng"><i>🎒</i><span>Cửa hàng</span></button><button data-panel="build" aria-label="Xây dựng"><i>🏡</i><span>Xây dựng</span></button></nav>
<small id="saveStatus" class="save-status">Tiến trình tự động lưu</small></main>
<div id="toast" role="status" aria-live="polite"></div><dialog id="modal" aria-label="Bảng thông tin trang trại"><button id="close" aria-label="Đóng">✕</button><div id="modalBody"></div></dialog><script src="game.js?v=cloud-2b"></script></body></html>
